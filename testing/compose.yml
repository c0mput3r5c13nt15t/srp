services:
  srp_gateway:
    build:
      context: ..
      dockerfile: srp_gateway/Dockerfile
    container_name: srp_gateway
    volumes:
      - ./gateway.toml:/app/gateway.toml:ro
    networks:
      internet:
        ipv4_address: 172.25.0.2

  srp_proxy:
    build:
      context: ..
      dockerfile: srp_proxy/Dockerfile
    container_name: srp_proxy
    volumes:
      - ./proxy.toml:/app/proxy.toml:ro
    depends_on:
      - srp_gateway
      - web
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      internet:
        ipv4_address: 172.25.0.3
      home:
        ipv4_address: 172.26.0.3

  web:
    image: caddy
    container_name: app
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      home:
        ipv4_address: 172.26.0.4

networks:
  internet:
    ipam:
     config:
       - subnet: 172.25.0.0/24
         gateway: 172.25.0.1
  home:
    ipam:
     config:
       - subnet: 172.26.0.0/24
         gateway: 172.26.0.1